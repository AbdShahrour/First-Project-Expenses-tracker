<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <!-- PHASE 2: build the page here.

       Your backend (Phase 1) is already running with real data in it,
       so build this page straight against the API - there is no
       in-memory or localStorage stage this time.

       1. Navbar
       2. Summary cards: total amount, number of expenses, highest expense
       3. Form to add an expense: title, amount, category (select), date
       4. Filter by category (with an "All" option)
       5. Table: title, amount, category, date, an edit button, a delete button

       Remember: the table rows must be built with JavaScript (DOM),
       not written by hand in this file. -->

    <!-- navbar 1  -->

    <!-- As a link -->
    <nav class="navbar bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand ms-5 text-white" href="#">Expense Tracker</a>
      </div>
    </nav>
    <!-- boxes  -->

    <div class="container my-5">
      <div class="row g-4">
        <!-- Total Amount -->
        <div class="col-12 col-md-4">
          <div class="card border border-secondary-subtle h-100">
            <div class="card-body text-center py-4">
              <h6 class="text-secondary">Total Amount</h6>

              <h3 class="text-dark fw-semibold" id="totalAmount">
                <span class="spinner-border" role="status">
                  <span class="visually-hidden">Loading...</span>
                </span>
              </h3>
            </div>
          </div>
        </div>

        <!-- Number Of Expenses -->
        <div class="col-12 col-md-4">
          <div class="card border border-secondary-subtle h-100">
            <div class="card-body text-center py-4">
              <h6 class="text-secondary">Number Of Expenses</h6>

              <h3 class="text-dark" id="expenseCount">
                <span class="spinner-border" role="status">
                  <span class="visually-hidden">Loading...</span>
                </span>
              </h3>
            </div>
          </div>
        </div>

        <!-- Highest Expense -->
        <div class="col-12 col-md-4">
          <div class="card border border-secondary-subtle h-100">
            <div class="card-body text-center py-4">
              <h6 class="text-secondary">Highest Expense</h6>

              <h3 class="text-dark" id="highestExpense">
                <span class="spinner-border" role="status">
                  <span class="visually-hidden">Loading...</span>
                </span>
              </h3>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- form 3  -->

    <div class="container">
      <div
        class="form-area border border-secondary-subtle p-4 bg-white my-5 rounded-2"
      >
        <h4>Add expense</h4>
        <form class="row">
          <div class="col-12 col-md-3 mb-3">
            <label for="" class="form-label">Title</label>
            <input
              type="title"
              class="form-control"
              id="expenseTitle"
              placeholder="Lunch"
            />
            <div class="invalid-feedback">Please enter an expense title.</div>
          </div>

          <div class="col-12 col-md-3 mb-3">
            <label for="" class="form-label">Amout</label>
            <input
              type="number"
              class="form-control"
              id="expenseAmount"
              placeholder="12.5"
            />
            <div class="invalid-feedback">
              Please enter an amount greater than 0.
            </div>
          </div>

          <div class="col-12 col-md-3 mb-3">
            <label for="" class="form-label">category</label>
            <select
              class="form-select"
              id="expenseCategory"
              aria-label="Default select example"
            >
              <option value="" selected disabled>Choose...</option>
              <option value="Other">Other</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Bills">Bills</option>
            </select>
            <div class="invalid-feedback">Please choose a category.</div>
          </div>

          <div class="col-12 col-md-3">
            <div class="mb-3">
              <label for="date" class="form-label">Date</label>
              <input type="date" class="form-control" id="date" />
              <div class="invalid-feedback">Please Input Date.</div>
            </div>
          </div>

          <button
            type="button"
            class="btn btn-primary col-3"
            id="submitExpense"
          >
            Add expense
          </button>
        </form>
      </div>
    </div>

    <div class="container">
      <div class="border border-secondary-subtle p-2 bg-white my-5 rounded-2">
        <div
          class="data-title d-flex align-items-center justify-content-between p-3 mb-4"
        >
          <h4>Expenses</h4>
          <div class="d-flex align-items-center gap-2">
            <label for="" class="form-label">category</label>
            <select
              class="form-select"
              aria-label="Default select example"
              id="expenseCategories"
            >
              <option selected value="All">All</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Bills">Bills</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
        <div>
          <input
            class="form-control my-2"
            type="text"
            name=""
            id="searchExpenseByTitle"
            placeholder="Search By Title"
          />
        </div>
        <div class="table-responsive">
          <div class="table-area">
            <table class="table table-striped">
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Category</th>
                  <th>Amount</th>
                  <th>Date</th>
                  <th>Action</th>
                </tr>
              </thead>

              <tbody id="tableBody"></tbody>
            </table>
          </div>
         
        </div>
      </div>
    </div>

    <!-- Modal  -->
    <div class="modal fade" id="editModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Edit Expense</h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body">
            <div class="mb-3">
              <label for="editTitle" class="form-label">Title</label>
              <input type="text" class="form-control" id="editTitle" />
            </div>

            <div class="mb-3">
              <label for="editAmount" class="form-label">Amount</label>
              <input type="number" class="form-control" id="editAmount" />
            </div>

            <div class="mb-3">
              <label for="editCategory" class="form-label">Category</label>

              <select class="form-select" id="editCategory">
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Shopping">Shopping</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="editDate" class="form-label">Date</label>

              <input type="date" class="form-control" id="editDate" />
            </div>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>

            <button type="button" class="btn btn-primary" id="saveEdit">
              Save
            </button>
          </div>
        </div>
      </div>
    </div>


    <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
